name: Sweep
options:
  bundleIdPrefix: by.timberbid
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions:
    - en
    - ru
    - de
    - fr
    - ja
    - Base
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: U5BAN54DL2
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

targets:
  Sweep:
    type: application
    platform: iOS
    sources:
      - path: Sweep
        excludes:
          - "Info.plist"
    resources:
      - path: Sweep/Resources
        optional: true
    info:
      path: Sweep/Info.plist
      properties:
        CFBundleDisplayName: Pixelbroom
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSPhotoLibraryUsageDescription: "Sweep scans your photo library locally to find duplicates, blurry shots and old screenshots. Nothing is uploaded — analysis happens entirely on your device."
        NSPhotoLibraryAddUsageDescription: "Sweep never adds photos to your library — this permission is requested only by iOS when restoring deleted items."
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.timberbid.sweep
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES

  SweepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SweepUITests
    dependencies:
      - target: Sweep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.timberbid.sweep.UITests
        TEST_TARGET_NAME: Sweep
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Sweep:
    build:
      targets:
        Sweep: all
        SweepUITests: [test]
    run:
      storeKitConfiguration: StoreKitTesting/Sweep.storekit
    test:
      targets:
        - SweepUITests
